# Matematikako Laborategia — jarduera
# YAML hau da jardueraren iturri nagusia.

id: "bi-sokak"
bertsioa: "0.6.3"
izena: "Bi sokak"

fitxa_teknikoa:
  deskribapen_laburra: >
    Bi sokak 60 minututan erretzen dira, baina ez abiadura konstantean.
    Bi sokak eta sua bakarrik erabiliz, 45 minutu zehazki neurtu behar dira.
  jarduera_mota: "Erronka"
  fasea:
    - "Kultura sortzea"
  denboralizazioa: "20–30 min"
  irekiera_maila: "Itxia"
  zailtasuna: "Ertaina"
  taldekatzea: "Ausazko 3ko taldeak"
  gaiak:
    - "Denbora"
    - "Logika"
  pentsatzeko_tresnak:
    - "Zer dakigu ziur?"
    - "Suposizioak berrikustea"
  konpetentziak:
    - kodea: "1.1"
      sakontasuna: 2
      nola_lantzen_da: "Baldintzak eta erabil daitekeen informazioa zuzen interpretatzea."
    - kodea: "1.2"
      sakontasuna: 3
      nola_lantzen_da: "Estrategiak probatu, baztertu eta informazio ziurra konbinatzea."
    - kodea: "5.1"
      sakontasuna: 2
      nola_lantzen_da: "Blokeoaren aurrean estrategia aldatzea."
    - kodea: "5.2"
      sakontasuna: 1
      nola_lantzen_da: "Taldean ideiak kontrastatzea."

jardueraren_aurkezpena:
  helburua: >
    Informazio osoa ez dugunean ere zer kontrolatu dezakegun identifikatzea.
  azalpen_nagusia: |
    Sokaren erdiak ez du zertan 30 minutu iraun. Baliteke lehen erdia bost minututan
    erretzea eta beste erdiak 55 behar izatea. Horregatik, luzera denbora bihurtzeko
    ohiko intuizioa ezin da erabili.

    Ikasleek maiz sokaren hiru laurdenak erabiltzea edo erdian marka egitea proposatzen
    dute. Galdera erabilgarria da: «Nola dakizu zati horrek denbora hori behar duela?»

    Aldaketa kontzeptuala «Zer dakigu ziur?» galdetzean dator. Soka bat bi muturretatik
    piztuta, 30 minututan amaituko da, nahiz eta ez jakin su-fronteak non elkartuko diren.

    0. minutuan lehen soka bi muturretatik pizten da eta bigarrena mutur batetik.
    30. minutuan lehenengoa amaitzen da eta bigarrenaren beste muturra pizten da.
    Geratzen den zatia 15 minututan amaitzen da: guztira 45 minutu.
  eramateko_ideia: >
    Informazio ezezagunaren barruan ere bada ziurtasunez kontrola daitekeen zerbait.

irakaslearen_fitxa:
  jardueraren_deskribapena: >
    Bi soketako bakoitzak 60 minutu behar ditu erabat erretzeko, baina ez dute
    abiadura konstantean erretzen. 45 minutu neurtu behar dira.
  aurkezpena: >
    Bi soka ditugu. Soka bakoitzak 60 minutu behar ditu guztiz erretzeko,
    baina ez dira abiadura konstantean erretzen. Nola neur ditzakegu zehazki 45 minutu?
  denboralizazioa:
    - tartea: "0–3 min"
      fasea: "Aurkezpena"
      azalpena: "Erronka eman."
    - tartea: "3–12 min"
      fasea: "Esplorazioa"
      azalpena: "Luzera-denbora suposizioak behatu."
    - tartea: "12–18 min"
      fasea: "Pistak"
      azalpena: "Pista-mailak behar denean."
    - tartea: "18–25 min"
      fasea: "Bateratzea"
      azalpena: "«Zer dakigu ziur?» ideia landu."
  pista_mailak:
    - "Soka bat mutur batetik piztuta, zer dakigu ziur?"
    - "Eta bi muturretatik pizten badugu?"
    - "30 minutu neurtzeko gai bagara, nola erabil dezakegu beste soka?"
  soluzioak:
    - izena: "45 minutuko denbora-diagrama"
      irudiak:
        - "../assets/bi_sokak.svg"
  hedapenak:
    - "Zein beste denbora zehatz neur daitezke bi sokekin?"
    - "40 minutu? 50 minutu? Zergatik?"

ikaslearen_fitxa:
  beharrezkoa: false
  aukera: >
    Nahi izanez gero, A5 txartel soil bat erabil daiteke enuntziatuarekin.

loturak:
  aurretik_egitekoak: []
  ondoren_egitekoak: []
