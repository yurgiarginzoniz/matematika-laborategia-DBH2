    azalpena: Taulak erakusten du ate bat bere zenbakiaren zatitzaile bakoitzeko behin aldatzen dela. Irekita geratzeko aldaketa-kopuruak bakoitia izan behar du.
  - izena: Zergatik karratu perfektuak?
    diagram_text: '12. atea → 1, 2, 3, 4, 6, 12 → 12ren zatitzaileak → 6 aldaketa → itxita


      9. atea → 1, 3, 9 → 9ren zatitzaileak → 3 aldaketa → irekita


      Zatitzaileak normalean bikoteka datoz: d eta n/d. Karratu perfektuetan erro karratua bere buruarekin parekatzen da; horregatik zatitzaile kopurua bakoitia da.'
    azalpena: 'Beraz, 100 aterekin irekita geratzen direnak karratu perfektuak dira: 1, 4, 9, 16, 25, 36, 49, 64, 81 eta 100.'
  ebaluazioan_zer_behatu:
  - Datuak sistematikoki antolatzen dituzten.
  - Patroia eta justifikazioa bereizten dituzten.
  - Zatitzaileen bikoteen azalpena ulertu eta komunikatzen duten.
  hedapenak:
  - n ate egongo balira, zenbat geratuko lirateke irekita?
  - Zer aldatzen da hasieran ate guztiak irekita badaude?
