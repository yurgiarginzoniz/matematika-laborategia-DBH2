id: zenbat-piano
bertsioa: 0.1.5
izena: Zenbat piano daude Bilbon?
fitxa_teknikoa:
  deskribapen_laburra: 'Daturik eman gabe, Bilbon zenbat piano dauden estimatu behar dute. Helburua ez da zenbaki «zuzena» asmatzea, baizik eta arrazoizko eredua eraiki eta defendatzea.

    '
  jarduera_mota: Erronka
  fasea:
  - Pentsatzeko tresnak garatzea
  denboralizazioa: 35–45 min
  irekiera_maila: Erdi-irekia
  zailtasuna: Ertaina
  taldekatzea: Ausazko 3ko taldeak
  gaiak:
  - Estimazioa
  - Modelizazioa
  pentsatzeko_tresnak:
  - Deskonposizioa
  - Estimazioa
  - Hipotesiak esplizitatzea
  konpetentziak:
  - kodea: '1.1'
    sakontasuna: 3
    nola_lantzen_da: Informazio falta interpretatu eta zer datu behar diren identifikatzea.
  - kodea: '1.2'
    sakontasuna: 3
    nola_lantzen_da: Problema deskonposatu, hipotesiak egin eta estrategia defendatzea.
  - kodea: '3.1'
    sakontasuna: 1
    nola_lantzen_da: Erlazio numerikoak erabiltzea biztanle, etxe eta proportzioen artean.
  - kodea: '5.2'
    sakontasuna: 2
    nola_lantzen_da: Taldean hipotesiak adostu eta justifikatzea.
jardueraren_aurkezpena:
  helburua: 'Informazio partzialarekin arrazoizko estimazio bat eraiki, defendatu eta berrikustea.

    '
  azalpen_nagusia: '«Zenbat piano daude Bilbon?» galderak nahita ez du behar adina datu erantzun zehatza kalkulatzeko. Lehen erreakzioa «ezin da jakin» izan daiteke, eta hori ez da oztopo bat saihestu beharrekoa: jardueraren abiapuntua da. Helburua da ikasleek ikustea matematikak ez duela beti datu guztiak jasotzen dituen enuntziatu itxi batekin lan egiten.


    Internet erabili gabe, taldeek berehala hasten dira behar lituzketen datuez galdetzen: zenbat biztanle ditu Bilbok, zenbat etxe daude, zenbat eskola, musika-eskola edo hotel, piano elektrikoak kontatzen diren... Galdera horiek ez dira jardueratik kanpoko zalantzak. Problema definitzen, kategoriak erabakitzen eta eredu bat eraikitzen ari dira.


    Fermi motako estimazioaren mugimendu nagusia deskonposizioa da. Adibidez, etxeetako pianoak estimatzeko, 350.000 biztanle eta etxeko 2,5 pertsona har daitezke: 350.000 / 2,5 ≈ 140.000 etxe. Ondoren, 20 etxetik batean piano bat dagoela suposatuz, 7.000 piano etxeetan lortuko genituzke. Zenbaki horiek ez dira «datu zuzenak»; hipotesiak dira, eta horregatik idatzi eta defendatu behar dira.


    Beste talde batek 100 etxetik batean pianoa dagoela pentsatzen badu, emaitza oso bestelakoa izango da. Une horretan agertzen da jardueraren galdera matematiko interesgarriena: «Benetako erantzuna ez badakigu, nola erabakitzen dugu zeinek egin duen matematika hobea?». Kalitatea ez da azken zenbakia errealitatearekin kasualitatez bat etortzea. Eredu hobe batek hipotesiak esplizitatzen ditu, arrazoizkoak direla defendatzen du, kategoria nagusiak kontuan hartzen ditu eta kalkulu koherenteak egiten ditu.


    Hipotesi guztiek ez dute eragin bera. Bilbok 350.000 edo 360.000 biztanle izateak emaitza gutxi aldatuko du; 20 etxetik batean edo 50etik batean pianoa dagoela pentsatzeak, ordea, asko. «Zein hipotesik du eragin handiena?» galdetzeak sentikortasunaren ideia modu intuitiboan lantzen du, terminologia teknikoa erabili beharrik gabe.


    Taldeek lehen eredua eraiki ondoren, aukera interesgarria da Internet erabiltzea erantzuna bilatzeko ez, baizik eta ereduko sarrera batzuk hobetzeko: benetako biztanleria, etxeko batez besteko pertsona kopurua edo eskola kopurua. Ondoren eredua berriz kalkulatzen da. Horrela, datuak ez dira pentsamenduaren ordezko; pentsatutako eredua fintzeko tresna dira.


    Jardueraren amaieran taldeek ez dute soilik zenbaki bat aurkeztu behar. Beren eredua, hipotesi erabakigarrienak eta emaitza nola aldatuko litzatekeen azaldu behar dute. Hori da Fermi-estimazioaren balio nagusia: informazio partzialarekin arrazoizko, gardena eta berrikusgarria den eredu bat eraikitzea.'
  eramateko_ideia: 'Matematikak ez dira soilik datu zehatzekin erantzun zehatzak lortzeko; informazio partzialarekin eredu arrazoizkoak eraikitzeko ere balio dute.

    '
  ikasleen_ibilbide_tipikoa:
  - «Ezin da jakin, datuak falta dira» erreakzioa agertzen da.
  - Zein datu beharko lituzketen galdetzean, problema deskonposatzen hasten dira.
  - Taldeek hipotesiei balio arrazoizkoak ematen dizkiete eta lehen eredua kalkulatzen dute.
  - Emaitza oso desberdinak alderatzean, azken zenbakia baino ereduaren kalitatea eztabaidatzen da.
  - Hipotesi erabakigarriena identifikatu eta, nahi bada, datu erreal batekin eredua berrikusten da.
  bateratze_eztabaida: &id001
  - Zer esan nahi dugu «piano» esaten dugunean? Zer sartuko dugu eta zer ez?
  - Galdera handi hau zein galdera txikiagotan bana daiteke?
  - Datu hori ez badakizue, zer balio izan daiteke arrazoizkoa? Zergatik?
  - Bi taldeek emaitza desberdinak badituzte, nola erabakitzen dugu zeinek egin duen matematika hobea?
  - Zein hipotesik du eragin handiena azken emaitzan?
  - Datu bakar bat egiaztatu ahal bazenute, zein aukeratuko zenukete eredua gehien hobetzeko?
irakaslearen_fitxa:
  jardueraren_deskribapena: 'Ikasleek Bilbon zenbat piano dauden estimatu behar dute datu zuzenik eta Internetik gabe. Talde bakoitzak bere eredu sinplifikatua eraiki, hipotesiak egin eta emaitza defendatzen du.

    '
  aurkezpena: 'Zenbat piano daude Bilbon? Internet ezin da erabili.

    '
  denboralizazioa:
  - tartea: 0–5 min
    fasea: «Ezinezkoa da»
    azalpena: Erreakzioak eta behar diren datuei buruzko galderak.
  - tartea: 5–15 min
    fasea: Eredua
    azalpena: Galdera handiaren deskonposizioa.
  - tartea: 15–25 min
    fasea: Zenbakiak
    azalpena: Hipotesiei balio arrazoizkoak eman.
  - tartea: 25–35 min
    fasea: Bateratzea
    azalpena: Ereduak alderatu, ez soilik emaitzak.
  - tartea: 35–45 min
    fasea: Sakontzea
    azalpena: Zein hipotesik eragiten duen gehien aztertu.
  galdera_erabilgarriak: *id001
  ebaluazioan_zer_behatu:
  - Hipotesiak esplizitatzeko gaitasuna.
  - Problema deskonposatzeko gaitasuna.
  - Kalkulu koherenteak egitea.
  - Ereduaren ahulguneak identifikatzea.
  soluzioak:
  - izena: Adibideko eredua — ez da erantzun eredugarria bakarra
    azalpena: 'Adibidez: 350.000 biztanle / 2,5 pertsona etxeko ≈ 140.000 etxe. 20 etxetik batean pianoa dagoela suposatuz ≈ 7.000 etxeko piano. Ondoren beste kategoriak gehitu beharko lirateke, taldeak bere definizioan sartzen baditu. Zenbaki hauen funtzioa eredu bat nola eraikitzen den erakustea da, ez ikasleei hipotesiak ematea.'
  amaierako_bateratzea: 'Ereduak alderatu, ez soilik emaitzak. Irizpideak: hipotesiak esplizituak eta defendagarriak izatea; kategoria nagusiak kontuan hartzea; kalkuluak koherenteak izatea; eta eredua informazio berriarekin berrikusi ahal izatea. Amaitu «Zein hipotesik du eragin handiena?» galderarekin.'
  hedapenak:
  - Eman tarte arrazoizko bat puntu-estimazio bakarraren ordez.
  - Aukeratu egiaztatuko zenuketen datu bakarra eta azaldu zergatik hobetuko lukeen eredua gehien.
  - Lehen eredua egin ondoren, bilatu Interneten sarrera egiaztagarri batzuk —ez piano kopurua— eta berrikalkulatu.
ikaslearen_fitxa:
  beharrezkoa: false
  aukera: 'A3 orri ia hutsa erabil daiteke: titulua, azken estimazioa, arrazoibidearentzako espazio handia eta hipotesi garrantzitsuenari buruzko galdera.

    '
